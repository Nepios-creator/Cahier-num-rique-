<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><title>Cahier numérique</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cahier">
<style>
:root{--bg:#f3f4fb;--ink:#12142b;--mut:#12142b99;--card:#fff;--line:#12142b1a;--acc:#4f46e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--ink:#eef0ff;--mut:#eef0ff99;--card:#ffffff12;--line:#ffffff1f;--acc:#818cf8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--ink:#eef0ff;--mut:#eef0ff99;--card:#ffffff12;--line:#ffffff1f;--acc:#818cf8;color-scheme:dark}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(900px 500px at 100% -10%,#6366f133,transparent),radial-gradient(700px 500px at -10% 110%,#14b8a633,transparent),var(--bg);background-attachment:fixed;min-height:100vh}
#app{max-width:640px;margin:auto;padding:0 16px 40px}
header{display:flex;align-items:center;gap:10px;padding:12px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{flex:1;font:700 18px system-ui;margin:0}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(10px);touch-action:manipulation}
button.p{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:0;width:100%;padding:14px;box-shadow:0 8px 20px #6366f155}
header button.p,.eh button.p{width:auto;padding:8px 16px}
.top{display:flex;align-items:center;gap:12px;padding:18px 0 10px}.top h1{flex:1;font:800 26px/1.05 system-ui;letter-spacing:-.03em;margin:0}.lg{width:44px;height:44px;border-radius:12px}
.sb input{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:16px;font-size:16px}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.cv{aspect-ratio:3/4;border-radius:22px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 12px 30px #0005;background:linear-gradient(160deg,#ffffff40,#00000070),var(--c)}
.cv::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:#ffffff22}
.cv b{font:800 21px/1.1 system-ui;letter-spacing:-.02em}.cv small{margin-bottom:auto;opacity:.85}.cv span{opacity:.8;font-size:13px}
.cv.add{background:var(--card);color:var(--ink);border:1.5px dashed var(--line);align-items:center;justify-content:center;text-align:center;box-shadow:none;font-weight:600}.cv.add::after{display:none}
.row{display:flex;gap:8px;align-items:flex-end;height:180px;padding:0 12px;margin-bottom:18px;border-bottom:12px solid #6b4423;border-radius:0 0 6px 6px;box-shadow:0 12px 14px -8px #0007;background:linear-gradient(transparent 75%,#0000002a)}
.bk{flex:0 0 calc(25% - 6px);border-radius:8px 8px 2px 2px;background:linear-gradient(90deg,#00000066,#ffffff33 14%,#00000012 62%,#00000050),var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 2px;cursor:pointer;box-shadow:3px 0 8px #0005;box-sizing:border-box;overflow:hidden}
.bk i{width:70%;height:5px;border-radius:3px;background:#ffffffaa}.bk b{writing-mode:vertical-rl;transform:rotate(180deg);font:700 14px system-ui;max-height:105px;overflow:hidden;text-overflow:ellipsis}.bk small{font-size:12px;opacity:.85}
.bk.add{background:var(--card);border:1.5px dashed var(--line);box-shadow:none;color:var(--ink);justify-content:center;height:130px}.bk.add b{max-height:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 12px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid}.stats b{font:800 22px system-ui;letter-spacing:-.02em}.stats small{color:var(--mut);font-size:12px}
.cont{border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,#ffffff33,#00000066),var(--c);display:grid;gap:2px;cursor:pointer;box-shadow:0 12px 30px #0005}.cont small{letter-spacing:2px;font-size:11px;opacity:.85}.cont b{font:800 22px/1.1 system-ui}.cont span{opacity:.9}
.lh{display:flex;justify-content:space-between;align-items:center;margin:20px 0 6px}.lh b{font:800 20px system-ui}.ch{padding:5px 12px;margin-left:6px;border-radius:20px;font-size:13px}.ch.on{background:var(--ink);color:var(--bg)}
.bkr{display:flex;align-items:center;gap:14px;padding:12px;margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:20px;cursor:pointer}.bkr .th{flex:none;width:54px;height:70px;border-radius:8px 14px 14px 8px;border-left:6px solid #0006;background:linear-gradient(160deg,#ffffff44,#00000066),var(--c);color:#fff;display:grid;place-items:center;font:800 24px system-ui;box-shadow:0 6px 14px #0005}.bi{flex:1;min-width:0;display:grid}.bi b{font:700 17px system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bi small{color:var(--mut)}.bkr>i{font-style:normal;font-size:26px;color:var(--mut)}
.bkr.add{border:1.5px dashed var(--line);background:transparent}.bkr.add .th{background:var(--card);color:var(--ink);box-shadow:none;border:1.5px dashed var(--line)}
.hero{border-radius:28px;padding:24px;color:#fff;background:linear-gradient(160deg,#ffffff40,#00000070),var(--c);box-shadow:0 16px 40px #0005}
.hero h2{font:800 34px/1.05 system-ui;letter-spacing:-.03em;margin:26px 0 6px}.hero p,.hero small,.hero em{opacity:.85;margin:0;font-style:normal}.hero small{display:block;margin-top:14px;letter-spacing:2px;font-size:11px}
.rs{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;cursor:pointer;display:grid;gap:2px}.rs small,.rs span{color:var(--mut);font-size:13px}
mark{background:#fde04799;color:inherit;border-radius:4px}
.hint{color:var(--mut);font-size:13px}
.f{display:grid;gap:12px;margin:12px 0}label{display:grid;gap:4px;font-size:14px}
input{font:inherit;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.sw{display:flex;gap:10px}.sw i{width:36px;height:36px;border-radius:50%;border:3px solid transparent}.sw i.on{border-color:var(--ink)}
.ed{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);background:var(--bg);z-index:10;max-width:760px;margin:auto}
.eh{display:flex;align-items:center;gap:10px;padding:10px 0;flex:none}.tt{flex:1;min-width:0;display:grid}.tt b,.tt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt small{color:var(--mut)}
.tb{display:flex;gap:6px;overflow-x:auto;flex:none;padding:6px 0;scrollbar-width:none;user-select:none;-webkit-user-select:none}.tb button{flex:none;min-width:40px;height:40px;padding:0 10px}.tb .d{min-width:0;width:30px;height:30px;padding:0;border-radius:50%;margin-top:5px}.tb i{width:1px;background:var(--line);flex:none;margin:6px 2px}
.meta{font-size:12px;color:var(--mut);padding:4px 2px;flex:none}
.sheet{flex:1;overflow-y:auto;background:#fbfbfe;color:#1b1d2e;border-radius:22px;padding:18px 20px;line-height:1.75;font-size:17px;outline:0;box-shadow:0 10px 30px #0004;word-break:break-word;overscroll-behavior:contain}.sheet h3{margin:.4em 0;font-size:22px}
.flip{animation:fl .4s ease-out}@keyframes fl{from{transform:translateY(18px);opacity:0}}
.dr{display:none;flex:none;height:40%;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:10px}.dr.on{display:flex;flex-direction:column}.drh{display:flex;justify-content:space-between;align-items:center}.drh button{padding:5px 10px;margin-left:4px}.dr textarea{flex:1;margin-top:8px;resize:none;font:inherit;border:0;outline:0;background:transparent;color:var(--ink)}
.ed.fs .eh,.ed.fs .meta,.ed.fs .tgs{display:none}.tgl,.tgs{display:flex;gap:6px;overflow-x:auto;flex:none;padding:8px 0;scrollbar-width:none}.tgl .ch,.tgs .ch{margin:0;flex:none}.tgs{padding:4px 0}.tgs input{flex:none;width:150px;padding:6px 10px;font-size:13px}#sc,#ak{position:fixed;inset:0;z-index:60;background:#000a;display:flex}.scb{width:100%;max-width:760px;margin:auto auto 0;background:var(--bg);border-radius:24px 24px 0 0;padding:16px;max-height:92%;overflow:auto;box-sizing:border-box;border:1px solid var(--line)}.th2{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.th2 img{height:90px;border-radius:8px}#so{width:100%;min-height:160px;box-sizing:border-box;font:inherit;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px}#bk,#bk *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#bk{position:fixed;inset:0;background:#000;z-index:200;display:grid;place-items:center;color:#2a2a2a;text-align:center;font-size:13px;touch-action:none}.gh{display:flex;align-items:center;gap:8px;margin:18px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line);scroll-margin-top:10px}.gh b{font:800 18px system-ui;color:var(--acc)}.gh small{color:var(--mut)}.nb{flex:none;width:20px;text-align:center;color:var(--mut);font-size:12px}.bkr{padding:8px 12px;margin:6px 0;gap:10px}.bkr .th{width:40px;height:52px;font-size:20px}#cp{flex:none;display:none;padding:4px 2px;font-size:13px}.ch2{display:inline-flex;gap:6px;padding:6px 12px;margin:3px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;cursor:pointer}#at{flex:none;max-height:90px;overflow:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;margin-top:10px}.card p{font:600 20px/1.5 system-ui}.card h3{color:var(--acc);font-size:24px}
#sp{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:#fff;background:radial-gradient(800px 600px at 80% 0,#6366f188,transparent),radial-gradient(700px 600px at 0 100%,#14b8a688,transparent),#0b1020;transition:opacity .5s}#sp.off{opacity:0;pointer-events:none}
#sp img{width:132px;height:132px;border-radius:32px;box-shadow:0 20px 60px #6366f166;animation:fl .8s}#sp h1{font:800 44px/1 system-ui;letter-spacing:-.04em;margin:8px 0 0}#sp p{opacity:.75;margin:0}#sp span{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom,0px));font-size:13px;opacity:.55}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;display:none;z-index:99}
</style></head><body><div id="app"></div><div id="t"></div><div id="sp" onclick="hideSp()"><img src="icon-512.png" alt=""><h1>Cahier<br>numérique</h1><p>Vos cours. Vos notes. Pour toujours.</p><button class="p" onclick="hideSp()" style="width:auto;padding:14px 38px;margin-top:14px">Ouvrir mon cahier</button></div>
<script>
const K='cahier-num-v1';let D={c:[],bk:0};
try{D=JSON.parse(localStorage.getItem(K))||D}catch(e){}
if(D.pj!='pivaqcvrzwxplqtznliw'){D.pj='pivaqcvrzwxplqtznliw';D.s=null;D.st='';(D.c||[]).forEach(c=>{c.d=1;c.u=c.u||Date.now();c.pages.forEach(p=>{p.d=1;p.u=p.u||Date.now();(p.att||[]).forEach(x=>{if(x.k=='p')x.up=0})})})}
let tm,st;const raw=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('Enregistrement impossible sur cet appareil')}};
const save=()=>{const n=Date.now();[cur,pg].forEach(x=>{if(x){x.u=n;x.d=1}});raw();clearTimeout(st);st=setTimeout(()=>sync(),3000)};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hm=t=>t?new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'…';
const dt=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const toast=m=>{const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',2500)};
const COL=['#6366f1','#0ea5e9','#10b981','#f59e0b','#ec4899','#8b5cf6'];let cur=null,pg=null,armed=0;
const nz=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const txt=h=>(h||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
function home(){cur=pg=null;const d=D.bk?'Dernière sauvegarde : '+dt(D.bk):'Aucune sauvegarde externe pour l’instant.';
app.innerHTML=`<div class=top><img class=lg src=icon-192.png alt=""><h1>Cahier numérique</h1><button onclick="agenda()">📅</button><button onclick="menu()">⋯</button></div><div class=sb><input id=q type=search placeholder="Rechercher dans mes cours et mes notes…" oninput="srch(this.value)"></div><div class=tgl>${tagChips()}</div><div id=res></div><div class=shelf id=sh>${lib()}</div><p class=hint>${D.s?'☁️ Compte : '+esc(D.s.email)+'. '+(D.st||''):'Pas de compte : vos notes ne sont que sur cet appareil (⋯ pour activer la sauvegarde en ligne).'} Tout s’enregistre automatiquement sur cet appareil. ${d} · version 5</p>`}
const grp=c=>D.sort=='r'?(d=>d<1?'Aujourd’hui':d<7?'Cette semaine':d<31?'Ce mois-ci':'Plus ancien')((Date.now()-mod(c))/864e5):((c.cours.trim().charAt(0)||'#').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
function listH(L,sd){const G=[];L.forEach(c=>{const g=grp(c);let x=G.find(y=>y.g==g);if(!x){x={g,a:[]};G.push(x)}x.a.push(c)});let n=0;
return(D.sort=='r'?'':`<div class=tgl>${G.map((x,i)=>`<button class=ch onclick="document.getElementById('g${i}').scrollIntoView({behavior:'smooth'})">${esc(x.g)}</button>`).join('')}</div>`)+G.map((x,i)=>`<div class=gh id="g${i}"><b>${esc(x.g)}</b><small>${x.a.length}</small></div>`+x.a.map(c=>`<div class=bkr onclick="openB('${c.id}')"><span class=nb>${++n}</span><div class=th style="--c:${c.color}">${esc(c.cours.trim().charAt(0).toUpperCase())}</div><div class=bi><b>${esc(c.cours)}</b><small>${esc(c.prof||'Professeur non indiqué')} · ${c.pages.length} page(s) · ${sd(mod(c))}</small></div><i>›</i></div>`).join('')).join('')}
const mod=c=>Math.max(c.u||0,...c.pages.map(p=>p.u||p.start||0));
function srt(k){D.sort=k;raw();home()}
function lib(){const L=D.c.filter(c=>!c.del),np=L.reduce((a,c)=>a+c.pages.length,0),m=Math.max(0,...L.map(mod));
L.sort(D.sort=='r'?(a,b)=>mod(b)-mod(a):(a,b)=>a.cours.localeCompare(b.cours,'fr'));
let last=null;L.forEach(c=>c.pages.forEach(p=>{if(!last||(p.u||p.start)>(last.p.u||last.p.start))last={c,p}}));
const sd=t=>t?new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'—';
return `<div class=stats><div><b>${L.length}</b><small>cahiers</small></div><div><b>${np}</b><small>pages</small></div><div><b>${sd(m)}</b><small>dernière note</small></div></div>`
+(last?`<div class=cont onclick="openB('${last.c.id}');openP('${last.p.id}')" style="--c:${last.c.color}"><small>REPRENDRE</small><b>${esc(last.c.cours)}</b><span>${esc(last.p.chap||'Sans chapitre')}${last.p.sujet?' — '+esc(last.p.sujet):''}</span></div>`:'')
+nextEv()+`<div class=lh><b>Mes cahiers</b><span><button class="ch${D.sort=='r'?' on':''}" onclick="srt('r')">Récents</button><button class="ch${D.sort=='r'?'':' on'}" onclick="srt('a')">A–Z</button></span></div>`
+listH(L,sd)
+`<div class="bkr add" onclick="newB()"><div class=th>＋</div><div class=bi><b>Nouveau cahier</b></div></div>`}
function srch(v){v=nz(v.trim().replace(/^#/,''));const r=$('#res'),sh=$('#sh');if(!v){r.innerHTML='';sh.style.display='';return}sh.style.display='none';let o='';
D.c.filter(c=>!c.del).forEach(c=>{if(nz(c.cours+' '+(c.prof||'')).includes(v))o+=`<div class=rs onclick="openB('${c.id}')"><b>${esc(c.cours)}</b><small>Cahier · ${esc(c.prof||'')}</small></div>`;
c.pages.forEach((p,i)=>{const t=txt(p.html),n=nz(t);if(v=='★'?!p.fav:!nz((p.chap||'')+' '+(p.sujet||'')+' '+t+' '+(p.tags||[]).join(' ')).includes(v))return;const k=n.indexOf(v);let sn='';if(k>=0)sn=esc(t.slice(Math.max(0,k-30),k))+'<mark>'+esc(t.slice(k,k+v.length))+'</mark>'+esc(t.slice(k+v.length,k+v.length+60));
o+=`<div class=rs onclick="openB('${c.id}');openP('${p.id}')"><b>${esc(c.cours)} · page ${i+1}</b><small>${esc(p.chap||'')} ${esc(p.sujet||'')}</small><span>${sn}</span></div>`})});
r.innerHTML=o||'<p class=hint>Aucun résultat.</p>'}
function menu(){app.innerHTML=`<header><button onclick=home()>‹</button><h1>Sauvegarde</h1></header><div class=f>${acct()}<hr style="width:100%;border:0;border-top:1px solid var(--line)"><button class=p onclick="exp()">Sauvegarder tous mes cahiers</button><label>Restaurer une sauvegarde<input type=file accept=".json,application/json" onchange="imp(this)"></label><button onclick="th()">Changer le thème clair / sombre</button><p class=hint>Le fichier de sauvegarde contient tous vos cahiers. Enregistrez-le dans Google Drive : sur un nouveau téléphone, il suffit de le restaurer ici.</p></div>`}
function th(){const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'}
async function exp(list,n){const f=new File([JSON.stringify({v:1,c:list||D.c})],(n||'cahiers')+'-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
D.bk=Date.now();raw();try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name=='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();toast('Fichier téléchargé')}
function imp(i){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);let n=0;j.c.forEach(c=>{const e=D.c.find(x=>x.id==c.id);if(!e){c.d=1;c.u=c.u||Date.now();c.pages.forEach(p=>{p.d=1;p.u=p.u||Date.now()});D.c.push(c);n++}else c.pages.forEach(p=>{if(!e.pages.find(x=>x.id==p.id)){p.d=1;p.u=p.u||Date.now();e.pages.push(p);n++}})});save();toast(n+' élément(s) restauré(s)');home()}catch(e){toast('Fichier invalide')}};r.readAsText(i.files[0])}
function newB(){app.innerHTML=`<header><button onclick=home()>‹</button><h1>Nouveau cahier</h1></header><div class=f><label>Nom du cours<input id=a></label><label>Nom du professeur<input id=b></label><label>Couleur de la couverture<div class=sw>${COL.map((x,i)=>`<i style="background:${x}" data-c="${x}" onclick="pick(this)" class="${i?'':'on'}"></i>`).join('')}</div></label><button class=p onclick=mk()>Créer le cahier</button></div>`}
